services:
  - type: web
    name: gmacgroup-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: '["https://gmacgroup.vercel.app"]'
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://gmacgroup.vercel.app
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STORAGE_PROVIDER
        value: supabase
      - key: STORAGE_BUCKET
        value: resumes
      - key: FLW_SECRET_KEY
        sync: false
      - key: FLW_WEBHOOK_SECRET_HASH
        sync: false
      - key: EMAIL_PROVIDER
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_TLS
        value: "true"
      - key: EMAIL_FROM
        sync: false
      - key: OPERATIONS_EMAIL
        value: workdisal480@gmail.com
